# Builds self-contained FestCast packages for Windows, Linux and macOS and publishes them as a GitHub release.
#
#   Push to main  -> tests, 5 builds, smoke tests, release published automatically.
#                    Version: pyproject.toml's version if that tag doesn't exist yet, else the next patch
#                    (1.0.0, 1.0.1, 1.0.2 ...). Bump pyproject.toml to 1.1.0 / 2.0.0 to start a new series.
#                    Pushes that only touch docs, README/markdown, LICENSE, tests or editor files are skipped,
#                    and so is any push whose commit message contains [skip ci].
#   Push a tag    -> git tag v1.2.3 && git push origin v1.2.3: release exactly that version (-beta etc. = pre-release).
#   Run workflow  -> Actions > Release > Run workflow: builds; publishes only if "publish" is ticked.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:                      # (path filters never apply to tag pushes)
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "tests/**"
      - ".gitignore"
      - ".gitattributes"
      - ".vscode/**"
      - ".claude/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (next version) after building"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:                           # a newer push to main replaces a run that hasn't published yet
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                 # all tags, to find the last release
      - name: Decide version
        id: v
        run: |
          base=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"; publish=true
          else
            if ! git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
              v="$base"
            else
              series="${base%.*}"
              last=$(git tag -l "v$series.*" | grep -E "^v$series\.[0-9]+$" | sort -V | tail -1)
              v="$series.$(( ${last##*.} + 1 ))"
            fi
            publish=true
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.publish }}" != true ]]; then
              v="$v-dev.${GITHUB_SHA::7}"; publish=false
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "### FestCast $v (publish: $publish)" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short 2>&1 | tee pytest.txt || {
            # each failure as an annotation, so it shows on the run page without opening the log
            grep -E "^(FAILED|ERROR) " pytest.txt | head -10 | while read -r line; do echo "::error title=pytest::$line"; done
            exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck dashboard
        working-directory: frontend
        run: npm ci --no-fund --no-audit && npm run typecheck

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   target: windows }
          - { os: ubuntu-22.04,     target: linux-x64 }     # older glibc = runs on more distros
          - { os: ubuntu-22.04-arm, target: linux-arm64 }   # Raspberry Pi 5, ARM servers
          - { os: macos-latest,     target: macos-arm64 }   # Apple silicon (always a current image)
          - { os: macos-15-intel,   target: macos-x64 }     # Intel Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build dashboard
        working-directory: frontend
        run: npm ci --no-fund --no-audit && npm run build

      - uses: actions/setup-python@v6          # runs the build script only; the package gets its own Python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
      - name: Fetch standalone CPython (python-build-standalone)
        shell: bash
        run: |
          echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/standalone-python" >> "$GITHUB_ENV"
          UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/standalone-python" uv python install "$PYTHON_VERSION"

      - name: Package
        shell: bash
        run: python packaging/build.py --python-dir "$UV_PYTHON_INSTALL_DIR" --version "${{ needs.version.outputs.version }}"

      - name: Smoke test the zip (unzips it, starts FestCast in simulation, checks dashboard + MediaMTX)
        shell: bash
        run: python packaging/smoke.py dist/FestCast-*-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FestCast-${{ matrix.target }}
          path: dist/FestCast-*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum FestCast-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          pre=""; [[ "$V" == *-* ]] && pre="--prerelease"
          # creates tag v$V on the built commit (a tag made with this token does not start another run)
          gh release create "v$V" dist/FestCast-*.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "FestCast $V" --generate-notes $pre
