<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>FestCast camera</title>
<style>
:root{--bg:#0e1013;--panel:#171a1f;--line:#262a31;--text:#e8eaed;--dim:#9aa0a8;--accent:#e5484d;--ok:#3fb950}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(20px,env(safe-area-inset-top)) 18px 32px}
.wrap{max-width:520px;margin:0 auto}.brand{font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--dim)}
h1{font-size:30px;margin:10px 0 2px}.sub{color:var(--dim);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row span:first-child{color:var(--dim)}
ol{padding-left:20px;margin:6px 0}li{margin:6px 0}
button{width:100%;padding:18px;font-size:18px;font-weight:650;border:0;border-radius:12px;background:var(--accent);color:#fff;margin-top:8px}
.err{color:#ff8a8a}.tag{display:inline-block;background:#232830;border-radius:6px;padding:2px 8px;font-size:13px}
</style></head><body><div class="wrap">
<div class="brand">FESTCAST · CAMERA</div>
<div id="main"><p class="sub">Loading…</p></div>
</div>
<script>
const token = location.pathname.split('/').pop();
const el = document.getElementById('main');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/public/join/' + encodeURIComponent(token), {cache: 'no-store'}).then(async r => {
  const j = await r.json();
  if (!r.ok) { el.innerHTML = `<h1>Link not valid</h1><p class="err">${esc(j.detail || 'Error')}</p>`; return; }
  el.innerHTML = `
    <h1>${esc(j.camera)}</h1><p class="sub">${esc(j.production)} · camera slot ${j.slot}</p>
    <div class="card">
      <div class="row"><span>You are operating</span><b>${esc(j.camera)}</b></div>
      <div class="row"><span>Requested quality</span><span class="tag">${esc(j.quality)} · ${j.fps} fps</span></div>
    </div>
    <div class="card"><b>Before you start</b><ol>
      <li>Use <b>Safari</b> (iPhone) or <b>Chrome</b> (Android). Stay on the festival Wi-Fi.</li>
      <li>Hold the phone <b>sideways (landscape)</b>.</li>
      <li>Plug into a power bank, turn <b>auto-lock / screen timeout off</b>, and keep this page in front: phones pause the camera when the screen locks or you switch apps.</li>
      <li>On the next page: allow camera access, choose the <b>rear camera</b> (you can switch there), check the preview, then press <b>Start</b>.</li>
      <li>Microphone: only choose one if the producer asked you to; otherwise pick "no audio".</li>
    </ol></div>
    <button id="go">Open camera</button>
    <p class="sub" style="margin-top:14px">To stop broadcasting, press <b>Hang up</b> on the camera page or close the tab. To restart, open this link again.</p>`;
  document.getElementById('go').onclick = () => { location.href = j.publish_url; };
}).catch(() => { el.innerHTML = '<h1>Cannot reach FestCast</h1><p class="err">Make sure you are on the festival Wi-Fi, then reload.</p>'; });
</script></body></html>
